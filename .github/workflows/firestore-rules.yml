name: Firestore rules

# 규칙 파일이나 그 테스트가 바뀔 때만 돈다 — 일반 PR의 필수 체크(`test`)와 분리한다.
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tool/firestore_rules_test/**'
      - '.github/workflows/firestore-rules.yml'

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tool/firestore_rules_test/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        working-directory: tool/firestore_rules_test
      - run: npm test
        working-directory: tool/firestore_rules_test
